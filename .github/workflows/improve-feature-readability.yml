name: Improve Qanteak product card readability
on:
  push:
    branches: [main]
    paths: ['.github/workflows/improve-feature-readability.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply readable feature-card styles
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')
          marker_start = '/* QANTEAK_FEATURE_READABILITY_START */'
          marker_end = '/* QANTEAK_FEATURE_READABILITY_END */'
          css = r'''
          /* QANTEAK_FEATURE_READABILITY_START */
          .bento{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
          .feature,.feature.large,.feature.med,.feature.small,.feature.wide{
            grid-column:auto!important;
            min-height:300px;
            padding:26px;
            border-radius:22px;
          }
          .featureTop{align-items:center}
          .featureIcon{width:46px;height:46px;border-radius:13px}
          .featureIcon svg{width:22px;height:22px}
          .featureNum{font-size:11px}
          .feature h3{font-size:22px;line-height:1.15;margin:24px 0 8px;letter-spacing:-.025em}
          .feature p{font-size:14px;line-height:1.55;max-width:none;color:#68727f}
          .featureUi{margin-top:20px;padding:16px;border-radius:15px}
          .featureUi small,.featureUi span{font-size:11px;line-height:1.4}
          .featureUi b{font-size:12px}
          .frow{font-size:12px;line-height:1.4;padding:10px 0;align-items:center}
          .frow b{font-size:12px}
          .miniProgress{height:7px;margin-top:9px}
          .folders{gap:10px;margin-top:12px}
          .folder{padding:13px 10px;border-radius:12px}
          .folder b{font-size:19px}
          .folder span{font-size:10px;line-height:1.3}
          .comments{gap:10px;margin-top:12px}
          .comment{padding:12px!important;border-radius:12px!important;font-size:12px!important;line-height:1.45!important}
          .featureUi input,.featureUi button{font-size:12px!important}
          .featureUi [class*="row"],.featureUi [class*="line"],.featureUi [class*="item"]{font-size:12px}
          .featureUi [class*="stat"] b,.featureUi [class*="metric"] b{font-size:18px}
          @media(max-width:980px){
            .bento{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
            .feature,.feature.large,.feature.med,.feature.small,.feature.wide{min-height:280px;padding:22px}
            .feature h3{font-size:21px}
            .feature p{font-size:14px}
          }
          @media(max-width:680px){
            .bento{grid-template-columns:1fr;gap:14px}
            .feature,.feature.large,.feature.med,.feature.small,.feature.wide{min-height:auto;padding:20px;border-radius:20px}
            .feature h3{font-size:20px;margin:18px 0 7px}
            .feature p{font-size:14px;line-height:1.5}
            .featureUi{padding:14px;margin-top:16px}
            .frow{font-size:12px;padding:9px 0}
            .folder b{font-size:18px}
            .folder span{font-size:10px}
          }
          /* QANTEAK_FEATURE_READABILITY_END */
          '''
          if marker_start in s and marker_end in s:
              a = s.index(marker_start)
              b = s.index(marker_end, a) + len(marker_end)
              s = s[:a] + css.strip() + s[b:]
          else:
              s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit readable cards
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Make Qanteak product cards readable'
          git push
