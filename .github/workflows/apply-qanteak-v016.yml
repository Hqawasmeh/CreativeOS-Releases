name: Apply Qanteak RC9 V0.16

on:
  push:
    paths:
      - '.github/workflows/apply-qanteak-v016.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: qanteak-desktop/package-lock.json

      - name: Apply V0.16 scoped changes
        run: python qanteak-desktop/scripts/upgrade-v016.py

      - name: Repair generated function override
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for rel in ['qanteak-desktop/src/app.js','qanteak-desktop/scripts/upgrade-v016.py']:
              p=Path(rel)
              s=p.read_text()
              s=s.replace("function docIcon(type){return type==='sheet'?'fi-rr-table-columns':type==='note'?'fi-rr-note-sticky':'fi-rr-document'}", "docIcon=function(type){return type==='sheet'?'fi-rr-table-columns':type==='note'?'fi-rr-note-sticky':'fi-rr-document'}")
              p.write_text(s)
          PY

      - name: Install dependencies
        working-directory: qanteak-desktop
        run: npm ci

      - name: Verify build and interactions
        working-directory: qanteak-desktop
        run: npm run build

      - name: Syntax checks
        working-directory: qanteak-desktop
        run: |
          node --check src/app.js
          node --check electron/backend.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs

      - name: Verify scoped V0.16 markers
        working-directory: qanteak-desktop
        shell: bash
        run: |
          grep -q "1.0.0-rc.9.16" package.json
          grep -q "v016SheetEditor" src/app.js
          grep -q "data-entity-delete" src/app.js
          grep -q "permissionGrid" src/styles.css
          awk '/RC9 V0.16 SHEETS \+ LIFECYCLE \+ PERMISSIONS/{flag=1} flag' src/app.js > /tmp/v016-block.txt
          if grep -q 'data-create="slide"' /tmp/v016-block.txt; then
            echo "Slides creation control still present in active V0.16 override" >&2
            exit 1
          fi

      - name: Commit verified V0.16 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qanteak-desktop
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m 'Qanteak OS RC9 V0.16 sheets lifecycle and permissions'
            git push
          fi
