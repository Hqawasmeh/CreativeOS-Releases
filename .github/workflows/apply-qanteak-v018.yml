name: Apply Qanteak RC9 V0.18

on:
  push:
    paths:
      - '.github/workflows/apply-qanteak-v018.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: qanteak-desktop/package-lock.json

      - name: Apply V0.18 hotfix
        run: python qanteak-desktop/scripts/upgrade-v018.py

      - name: Install dependencies
        working-directory: qanteak-desktop
        run: npm ci

      - name: Verify build and interactions
        working-directory: qanteak-desktop
        run: npm run build

      - name: Syntax checks
        working-directory: qanteak-desktop
        run: |
          node --check src/app.js
          node --check electron/backend.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs

      - name: Verify V0.18 safeguards and New menu
        working-directory: qanteak-desktop
        shell: bash
        run: |
          grep -q "1.0.0-rc.9.18" package.json
          grep -q "WORKSPACE_CACHE_PREFIX" src/app.js
          grep -q "workspaceLoaded" src/app.js
          grep -q "v018OpenQuickCreate" src/app.js
          grep -q "data-quick-create" src/app.js
          grep -q "quickCreateGrid" src/styles.css
          if tail -n 300 src/app.js | grep -q 'data-quick-create="slide"'; then
            echo "Slides unexpectedly present in New menu" >&2
            exit 1
          fi

      - name: Commit verified V0.18 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qanteak-desktop
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m 'Qanteak OS RC9 V0.18 recovery and New menu hotfix'
            git push
          fi
