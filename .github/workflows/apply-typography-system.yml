name: Apply Qanteak typography system
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-typography-system.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply six-level typography scale
        shell: python
        run: |
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text(encoding='utf-8')
          a='/* QANTEAK_TYPOGRAPHY_SYSTEM_START */'
          b='/* QANTEAK_TYPOGRAPHY_SYSTEM_END */'
          css=r'''
          /* QANTEAK_TYPOGRAPHY_SYSTEM_START */
          :root{
            --type-display:60px;
            --type-section:44px;
            --type-card:24px;
            --type-body:16px;
            --type-secondary:14px;
            --type-micro:12px;
          }

          /* 01 — Display / hero */
          .heroTitle,.ctaTitle,.display{
            font-size:var(--type-display)!important;
            line-height:.98!important;
          }

          /* 02 — Section titles */
          .sectionTitle,
          .solutionTop .sectionTitle,
          .productIntro .sectionTitle,
          .problemIntro .sectionTitle{
            font-size:var(--type-section)!important;
            line-height:1.05!important;
          }

          /* 03 — Card / feature titles */
          .feature h3,.problemCard h3,.workflowCard h3,.flowCard h3,.flowStep h3,
          .testerCard h3,.feedbackCard h3,.betaCard h3,
          .uiCard h4,.solutionNode b,
          .sectionPanel h3,.sectionPanel h4{
            font-size:var(--type-card)!important;
            line-height:1.18!important;
          }

          /* 04 — Primary body copy */
          .heroCopy,.lead,
          .problemCard p,.feature p,
          .workflowCard p,.flowCard p,.flowStep p,
          .testerCard p,.feedbackCard p,.betaCard p,
          .sectionPanel>p,.sectionPanel article p,
          [class*="workflow"] p,[class*="flow"] p,
          [class*="tester"] p,[class*="feedback"] p{
            font-size:var(--type-body)!important;
            line-height:1.62!important;
          }

          /* 05 — Secondary copy */
          .metaItem span,.proofLead,.pill,.problemStat span,
          .featureUi span,.featureUi b,.frow,.frow b,.folder span,.comment,
          .solutionFooter,.floatCard span,.links,.btn,
          [class*="stat"] span,[class*="step"] span,
          [class*="workflow"] span,[class*="flow"] span,
          [class*="tester"] span,[class*="feedback"] span{
            font-size:var(--type-secondary)!important;
            line-height:1.5!important;
          }

          /* 06 — Micro labels / compact UI */
          .eyebrow,.kicker,.featureNum,.status,
          small,.featureUi small,.workflowCard small,.flowCard small,.flowStep small,
          .testerCard small,.feedbackCard small,.betaCard small,
          [class*="badge"],[class*="tag"],
          .appShell small,.appShell span,.appShell .taskLine,.appShell .status,
          .solutionNode span{
            font-size:var(--type-micro)!important;
            line-height:1.4!important;
          }

          /* Preserve numerical hierarchy */
          .metaItem b,.problemStat b,.metric b,.folder b{
            font-size:24px!important;
            line-height:1.1!important;
          }

          /* Compact product/interface mockups should obey the same floor without breaking layout */
          .appShell .appTop b,.floatCard b{font-size:14px!important}
          .featureUi input,.featureUi button{font-size:var(--type-secondary)!important}

          @media(max-width:680px){
            :root{
              --type-display:44px;
              --type-section:34px;
              --type-card:21px;
              --type-body:16px;
              --type-secondary:14px;
              --type-micro:12px;
            }
            .heroTitle{line-height:1!important}
            .sectionTitle{line-height:1.08!important}
          }

          @media(max-width:380px){
            :root{
              --type-display:40px;
              --type-section:31px;
              --type-card:20px;
            }
          }
          /* QANTEAK_TYPOGRAPHY_SYSTEM_END */
          '''
          # Remove previous broad font-floor/readability overrides so this system is authoritative.
          for start,end in [
            ('/* QANTEAK_GLOBAL_READABILITY_START */','/* QANTEAK_GLOBAL_READABILITY_END */'),
            ('/* QANTEAK_FONT_FLOOR_START */','/* QANTEAK_FONT_FLOOR_END */')
          ]:
              if start in s and end in s:
                  i=s.index(start); j=s.index(end,i)+len(end); s=s[:i]+s[j:]
          if a in s and b in s:
              i=s.index(a); j=s.index(b,i)+len(b); s=s[:i]+css.strip()+s[j:]
          else:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit typography system
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply six-level typography system site-wide'
          git push
