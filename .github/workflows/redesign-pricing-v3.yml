name: Redesign Qanteak pricing V3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/redesign-pricing-v3.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace pricing component
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('docs/index.html')
          s=p.read_text(encoding='utf-8')
          section=r'''<section class="section" id="pricing">
          <div class="shell panel sectionPanel pricingPanel pricingV3">
            <div class="sectionHead center">
              <div class="kicker">Pricing</div>
              <h2 class="sectionTitle">Choose the Qanteak plan that fits your work.</h2>
              <p class="lead">Start solo, unlock the intelligence layer, or bring your whole team into one operating workspace.</p>
              <div class="billingToggle" role="group" aria-label="Billing period">
                <button type="button" class="billingBtn active" data-billing="monthly" aria-pressed="true">Monthly</button>
                <button type="button" class="billingBtn" data-billing="annual" aria-pressed="false">Annual <span>Save up to 18%</span></button>
              </div>
            </div>
            <div class="plansV3" data-billing-state="monthly">
              <article class="priceCard basicCard" data-monthly="18" data-annual="15">
                <div class="priceHead">
                  <div class="priceNameRow"><h3>Basic</h3></div>
                  <p class="planFor">For solo creatives who need the full core workspace.</p>
                  <div class="priceRow">
                    <span class="oldPrice" aria-hidden="true">$18</span>
                    <strong class="currentPrice">$18</strong>
                    <span class="priceUnit">/month</span>
                  </div>
                </div>
                <div class="featurePanel">
                  <div class="featureLine"><span class="check">✓</span><span><b>Unlimited</b> projects</span></div>
                  <div class="featureLine"><span class="check">✓</span><span><b>Unlimited</b> clients</span></div>
                  <div class="featureLine"><span class="check">✓</span><span>Tasks, calendar & invoices</span></div>
                  <div class="featureLine"><span class="check">✓</span><span>Client reviews & approvals</span></div>
                  <div class="featureLine"><span class="check">✓</span><span>Local file management</span></div>
                  <div class="featureLine"><span class="check">✓</span><span>10 GB cloud storage</span></div>
                  <div class="featureLine"><span class="check">✓</span><span>Limited Qanteak AI</span></div>
                  <div class="featureLine"><span class="check">✓</span><span>Basic business analytics</span></div>
                </div>
                <p class="planSummary">Everything you need to run your creative work in one connected place.</p>
                <a class="chooseBtn dark" href="#download">Choose Basic</a>
              </article>

              <article class="priceCard proCard" data-monthly="29" data-annual="24">
                <div class="bestBadge">Most popular</div>
                <div class="priceHead">
                  <div class="priceNameRow"><h3>Pro</h3></div>
                  <p class="planFor">For professionals who want Qanteak's full intelligence layer.</p>
                  <div class="priceRow">
                    <span class="oldPrice" aria-hidden="true">$29</span>
                    <strong class="currentPrice">$29</strong>
                    <span class="priceUnit">/month</span>
                  </div>
                </div>
                <div class="featurePanel">
                  <div class="featureLine"><span class="check">✓</span><span>Everything in Basic</span></div>
                  <div class="featureLine"><span class="check">✓</span><span><b>Full Qanteak AI</b></span></div>
                  <div class="featureLine"><span class="check">✓</span><span>AI project & business insights</span></div>
                  <div class="featureLine"><span class="check">✓</span><span>Advanced file intelligence</span></div>
                  <div class="featureLine"><span class="check">✓</span><span>100 GB cloud storage</span></div>
                  <div class="featureLine"><span class="check">✓</span><span>Advanced analytics</span></div>
                  <div class="featureLine"><span class="check">✓</span><span>High-limit automations</span></div>
                  <div class="featureLine"><span class="check">✓</span><span>Priority support</span></div>
                </div>
                <p class="planSummary">Work faster with AI, smarter files, deeper insight and less admin.</p>
                <a class="chooseBtn gradient" href="#download">Choose Pro</a>
              </article>

              <article class="priceCard teamsCard" data-monthly="38" data-annual="32">
                <div class="priceHead">
                  <div class="priceNameRow"><h3>Teams</h3></div>
                  <p class="planFor">For agencies, studios and companies working together.</p>
                  <div class="priceRow">
                    <span class="oldPrice" aria-hidden="true">$38</span>
                    <strong class="currentPrice">$38</strong>
                    <span class="priceUnit">/seat/month</span>
                  </div>
                </div>
                <div class="featurePanel">
                  <div class="featureLine"><span class="check">✓</span><span>Everything in Pro</span></div>
                  <div class="featureLine"><span class="check">✓</span><span><b>Unlimited</b> shared workspaces</span></div>
                  <div class="featureLine"><span class="check">✓</span><span>Roles & permissions</span></div>
                  <div class="featureLine"><span class="check">✓</span><span>Shared AI knowledge</span></div>
                  <div class="featureLine"><span class="check">✓</span><span>100 GB+ cloud / seat</span></div>
                  <div class="featureLine"><span class="check">✓</span><span>Team & workload analytics</span></div>
                  <div class="featureLine"><span class="check">✓</span><span>Centralized billing</span></div>
                  <div class="featureLine"><span class="check">✓</span><span>Shared automations</span></div>
                </div>
                <p class="planSummary">Give the whole team shared context, control and intelligence.</p>
                <a class="chooseBtn dark" href="#download">Choose Teams</a>
              </article>
            </div>
            <p class="pricingNote">14-day Pro trial · No credit card required · Annual plans billed yearly</p>
          </div>
          </section>'''
          s,n=re.subn(r'<section class="section" id="pricing">.*?</section>',section,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('pricing section not found exactly once')

          css=r'''
          /* QANTEAK_PRICING_V3_START */
          .pricingV3{background:#f8f9fc}
          .billingToggle{display:inline-flex;align-items:center;gap:5px;margin-top:24px;padding:5px;border:1px solid #dce3ed;border-radius:999px;background:#fff}
          .billingBtn{border:0;background:transparent;border-radius:999px;padding:10px 15px;font-size:13px;font-weight:700;color:#626b77;cursor:pointer;transition:background .25s ease,color .25s ease,transform .25s ease}
          .billingBtn span{font-size:10px;margin-left:5px;color:var(--blue)}
          .billingBtn.active{background:#090b12;color:#fff;transform:scale(1.02)}
          .billingBtn.active span{color:var(--cyan)}
          .plansV3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;max-width:1080px;margin:34px auto 0;align-items:stretch}
          .priceCard{position:relative;display:flex;flex-direction:column;min-width:0;border:1px solid #dfe5ee;border-radius:28px;padding:24px;background:#fff;overflow:hidden;transition:transform .38s cubic-bezier(.2,1.45,.45,1),box-shadow .32s ease,border-color .32s ease}
          .priceCard.basicCard{background:linear-gradient(180deg,#f7fbff 0%,#fff 34%)}
          .priceCard.proCard{background:linear-gradient(180deg,#edfaff 0%,#fff 36%);border-color:#82c9ff}
          .priceCard.teamsCard{background:linear-gradient(180deg,#eef6ff 0%,#fff 34%)}
          .priceCard:hover{transform:translateY(-4px);box-shadow:0 20px 45px rgba(5,5,93,.08)}
          .priceCard.priceBounce{animation:priceBounce .62s cubic-bezier(.2,1.5,.45,1)}
          @keyframes priceBounce{0%{transform:scale(1)}38%{transform:scale(.965) translateY(4px)}70%{transform:scale(1.025) translateY(-5px)}100%{transform:scale(1) translateY(0)}}
          .bestBadge{position:absolute;right:20px;top:20px;padding:7px 10px;border-radius:999px;background:linear-gradient(100deg,var(--navy),var(--blue),var(--cyan));color:#fff;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
          .priceHead{padding-bottom:18px;border-bottom:1px solid #e8edf3}
          .priceNameRow h3{font-size:25px!important;line-height:1.15;margin:0 0 14px!important;letter-spacing:-.03em}
          .planFor{font-size:14px!important;line-height:1.5!important;color:#747d89!important;margin:0 0 18px!important;min-height:42px}
          .priceRow{display:flex;align-items:baseline;gap:6px;min-height:58px;flex-wrap:wrap}
          .currentPrice{font-size:52px;line-height:1;letter-spacing:-.055em;color:#090b12;transition:opacity .18s ease,transform .18s ease}
          .priceUnit{font-size:12px;color:#5e6774;white-space:nowrap}
          .oldPrice{display:none;font-size:21px;color:#a0a7b1;text-decoration:line-through;text-decoration-thickness:2px}
          .plansV3[data-billing-state="annual"] .oldPrice{display:inline}
          .plansV3[data-billing-state="annual"] .priceUnit:after{content:' billed annually';display:block;font-size:10px;color:#68717d;margin-top:3px}
          .featurePanel{margin:20px 0 18px;padding:18px;border-radius:17px;background:#f3f9ff;display:grid;gap:13px;min-height:316px}
          .proCard .featurePanel{background:linear-gradient(135deg,#eefaff,#e7fcff)}
          .teamsCard .featurePanel{background:#eef6ff}
          .featureLine{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.4;color:#343c47}
          .featureLine .check{width:20px;height:20px;border-radius:50%;border:1px solid #a9c9eb;color:var(--blue);display:grid;place-items:center;font-size:11px;font-weight:800;flex:0 0 20px;background:#fff}
          .featureLine b{color:var(--navy)}
          .planSummary{font-size:14px!important;line-height:1.5!important;color:#313842!important;margin:0 0 18px!important;min-height:63px}
          .chooseBtn{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:15px;font-size:14px;font-weight:800;margin-top:auto;transition:transform .22s ease,box-shadow .22s ease}
          .chooseBtn.dark{background:#0a0b10;color:#fff}
          .chooseBtn.gradient{background:linear-gradient(100deg,var(--navy),var(--blue) 62%,var(--cyan));color:#fff}
          .chooseBtn:hover{transform:translateY(-2px)}
          .pricingNote{text-align:center;margin:18px 0 0;font-size:12px;color:#7b8490}
          @media(max-width:980px){.plansV3{grid-template-columns:1fr;max-width:620px}.featurePanel{min-height:auto}.planSummary{min-height:auto}.planFor{min-height:auto}}
          @media(max-width:680px){.pricingV3{padding:30px 18px!important}.billingToggle{width:100%;display:grid;grid-template-columns:1fr 1fr}.billingBtn{padding:11px 8px}.billingBtn span{display:block;margin:2px 0 0}.priceCard{padding:20px;border-radius:22px}.currentPrice{font-size:46px}.priceNameRow h3{font-size:23px!important}.planFor,.featureLine,.planSummary{font-size:14px!important}.featurePanel{padding:16px;gap:12px}.bestBadge{right:16px;top:16px}}
          @media(prefers-reduced-motion:reduce){.priceCard,.billingBtn,.chooseBtn{transition:none}.priceCard.priceBounce{animation:none}}
          /* QANTEAK_PRICING_V3_END */
          '''
          s=re.sub(r'/\* QANTEAK_PRICING_V2_START \*/.*?/\* QANTEAK_PRICING_V2_END \*/',css.strip(),s,count=1,flags=re.S)
          if 'QANTEAK_PRICING_V3_START' not in s:
              s=s.replace('</style>',css+'\n</style>',1)

          js=r'''
          <script id="qanteak-pricing-toggle">
          (()=>{
            const root=document.querySelector('.pricingV3');
            if(!root||root.dataset.toggleReady==='1') return;
            root.dataset.toggleReady='1';
            const buttons=[...root.querySelectorAll('.billingBtn')];
            const plans=root.querySelector('.plansV3');
            const cards=[...root.querySelectorAll('.priceCard')];
            const setBilling=(mode)=>{
              plans.dataset.billingState=mode;
              buttons.forEach(btn=>{const on=btn.dataset.billing===mode;btn.classList.toggle('active',on);btn.setAttribute('aria-pressed',String(on));});
              cards.forEach((card,index)=>{
                const price=mode==='annual'?card.dataset.annual:card.dataset.monthly;
                const node=card.querySelector('.currentPrice');
                node.style.opacity='0';node.style.transform='translateY(6px)';
                setTimeout(()=>{node.textContent='$'+price;node.style.opacity='1';node.style.transform='translateY(0)'},120);
                card.classList.remove('priceBounce');
                void card.offsetWidth;
                setTimeout(()=>card.classList.add('priceBounce'),index*55);
              });
            };
            buttons.forEach(btn=>btn.addEventListener('click',()=>setBilling(btn.dataset.billing)));
          })();
          </script>
          '''
          s=re.sub(r'<script id="qanteak-pricing-toggle">.*?</script>','',s,flags=re.S)
          s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit pricing redesign
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Redesign pricing cards with billing toggle'
          git push
