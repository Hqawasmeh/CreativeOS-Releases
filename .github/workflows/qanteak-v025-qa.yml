name: Qanteak V0.25 QA

on:
  push:
    branches:
      - qanteak-v025-operations-expansion
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qanteak-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qanteak-desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run full build and smoke suite
        run: npm run build
      - name: Verify V0.25 markers
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='1.0.0-rc.9.25') process.exit(1)"
          grep -q "timesheets" src/v024-model.js
          grep -q "dashboards" src/v024-model.js
          grep -q "Plan with AI" src/v024-workspace.js
          grep -q "q25-timeline" src/v024-workspace.css
          grep -q "left join public.q24_records qr" backend/v024/schema.sql
