name: Qanteak mobile readability pass
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mobile-readability-pass.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase small website typography
        shell: python
        run: |
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text(encoding='utf-8')
          a='/* QANTEAK_GLOBAL_READABILITY_START */'
          b='/* QANTEAK_GLOBAL_READABILITY_END */'
          css=r'''
          /* QANTEAK_GLOBAL_READABILITY_START */
          /* Readability floor: supporting copy should never look like UI microprint. */
          .topbar{font-size:12px}
          .links{font-size:14px}
          .btn{font-size:13px}
          .eyebrow,.kicker{font-size:11px;line-height:1.4}
          .heroCopy,.lead{font-size:16px;line-height:1.65}
          .metaItem span{font-size:13px;line-height:1.35}
          .proofLead{font-size:14px}.pill{font-size:12px}
          .problemCard p{font-size:14px;line-height:1.55}
          .problemStat span{font-size:12px;line-height:1.35}
          .problemStat b{font-size:18px}
          .workflowCard p,.flowCard p,.flowStep p{font-size:14px!important;line-height:1.55!important}
          .workflowCard small,.flowCard small,.flowStep small{font-size:11px!important;line-height:1.4!important}
          .testerCard p,.feedbackCard p,.betaCard p{font-size:14px!important;line-height:1.55!important}
          .testerCard small,.feedbackCard small,.betaCard small{font-size:11px!important;line-height:1.4!important}
          .solutionNode span{font-size:11px;line-height:1.35}.solutionNode b{font-size:13px}
          .solutionFooter{font-size:13px}
          @media(max-width:680px){
            .shell{width:min(100% - 28px,1180px)}
            .heroCopy,.lead{font-size:16px;line-height:1.6}
            .metaItem span{font-size:13px}
            .metaItem b{font-size:24px}
            .problemCard p{font-size:15px;line-height:1.55}
            .problemStat span{font-size:13px}.problemStat b{font-size:19px}
            .workflowCard p,.flowCard p,.flowStep p{font-size:15px!important;line-height:1.55!important}
            .workflowCard small,.flowCard small,.flowStep small{font-size:12px!important}
            .testerCard p,.feedbackCard p,.betaCard p{font-size:15px!important;line-height:1.55!important}
            .testerCard small,.feedbackCard small,.betaCard small{font-size:12px!important}
            .feature p{font-size:15px;line-height:1.55}
            .featureUi small,.featureUi span,.folder span{font-size:12px}
            .frow,.frow b{font-size:13px}
            .solutionNode span{font-size:10px}.solutionNode b{font-size:12px}
            .solutionFooter{font-size:14px}
          }
          @media(max-width:380px){
            .heroCopy,.lead,.problemCard p,.workflowCard p,.flowCard p,.flowStep p,.testerCard p,.feedbackCard p,.betaCard p,.feature p{font-size:14px!important}
            .solutionNode span{font-size:9px}
          }
          /* QANTEAK_GLOBAL_READABILITY_END */
          '''
          if a in s and b in s:
              i=s.index(a); j=s.index(b,i)+len(b); s=s[:i]+css.strip()+s[j:]
          else:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit readability update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Increase website text readability across mobile and desktop'
          git push
