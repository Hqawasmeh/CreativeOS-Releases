name: Fix Qanteak RC9 V0.15 Creation and Invite

on:
  push:
    paths:
      - '.github/workflows/fix-qanteak-v015-creation-invite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: qanteak-desktop/package-lock.json
      - name: Apply V0.15 repair
        run: python qanteak-desktop/scripts/fix-v015-creation-invite.py
      - name: Install dependencies
        working-directory: qanteak-desktop
        run: npm ci
      - name: Verify build and interactions
        working-directory: qanteak-desktop
        run: npm run build
      - name: Syntax checks
        working-directory: qanteak-desktop
        run: |
          node --check src/app.js
          node --check electron/backend.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
      - name: Commit verified V0.15 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qanteak-desktop
          git commit -m 'Qanteak OS RC9 V0.15 fix creation and invitation reliability'
          git push
