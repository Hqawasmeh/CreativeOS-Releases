name: Replace hub Q with Qanteak symbol
on:
  push:
    branches: [main]
    paths: ['.github/workflows/replace-hub-q-with-logo.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace hub mark
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text()
          old='<div class="hubMark">Q</div>'
          new='<div class="hubMark"><img src="assets/qanteak-hub-symbol.png" alt="Qanteak symbol"></div>'
          if old not in s:
              raise SystemExit('hub Q markup not found')
          s=s.replace(old,new,1)
          css='''\n<style>\n.hubMark{display:grid;place-items:center;overflow:hidden}.hubMark img{display:block;width:36px;height:36px;object-fit:contain}\n@media(max-width:900px){.hubMark img{width:32px;height:32px}}\n@media(max-width:560px){.hubMark img{width:28px;height:28px}}\n</style>\n'''
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
      - name: Commit website edit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use Qanteak symbol in solution hub'
          git push
