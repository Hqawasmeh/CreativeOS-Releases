name: Publish Qanteak Desktop

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: qanteak-desktop

jobs:
  build-and-publish-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: qanteak-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Preflight, renderer, interaction smoke, and build
        run: npm run build

      - name: Resolve release metadata
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^1\.0\.0-rc\.9\.(\d+)$') { throw "Unexpected RC9 version: $version" }
          $minor = $Matches[1]
          $tag = "v$version"
          $changelog = "CHANGELOG-RC9-V0.$minor.md"
          if (-not (Test-Path $changelog)) { throw "Missing changelog: $changelog" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_MINOR=$minor" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CHANGELOG_FILE=$changelog" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Refuse duplicate release before packaging
        shell: pwsh
        run: |
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists. Refusing to rebuild or replace updater artifacts." }
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package Windows installer exactly once
        run: npx electron-builder --win nsis --publish never
        env:
          QANTEAK_REQUIRE_SIGNING: '0'

      - name: Verify updater artifacts
        run: npm run qa:release

      - name: Windows artifact QA
        shell: pwsh
        run: ./scripts/windows-qa-preflight.ps1

      - name: Validate exact release files
        shell: pwsh
        run: |
          $exe = "release/QanteakOS-Setup-$env:VERSION.exe"
          $blockmap = "$exe.blockmap"
          $yml = "release/latest.yml"
          if (-not (Test-Path $exe)) { throw "Missing installer: $exe" }
          if (-not (Test-Path $blockmap)) { throw "Missing blockmap: $blockmap" }
          if (-not (Test-Path $yml)) { throw "Missing updater metadata: $yml" }
          $latest = Get-Content $yml -Raw
          if ($latest -notmatch [regex]::Escape("QanteakOS-Setup-$env:VERSION.exe")) { throw "latest.yml points to the wrong installer." }
          $releaseFiles = @(Get-ChildItem release -File | Where-Object { $_.Name -match '^(QanteakOS-Setup-.*\.exe(\.blockmap)?|latest\.yml)$' })
          $required = @("QanteakOS-Setup-$env:VERSION.exe","QanteakOS-Setup-$env:VERSION.exe.blockmap","latest.yml")
          foreach ($r in $required) { if ($releaseFiles.Name -notcontains $r) { throw "Missing expected artifact $r" } }
          $unexpected = @($releaseFiles.Name | Where-Object { $required -notcontains $_ })
          if ($unexpected.Count -gt 0) { throw "Unexpected updater artifacts: $($unexpected -join ', ')" }

      - name: Publish exact updater artifacts
        shell: pwsh
        run: |
          gh release create "$env:RELEASE_TAG" `
            "release/QanteakOS-Setup-$env:VERSION.exe" `
            "release/QanteakOS-Setup-$env:VERSION.exe.blockmap" `
            "release/latest.yml" `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "Qanteak OS RC9 V0.$env:RELEASE_MINOR" `
            --notes-file "$env:CHANGELOG_FILE" `
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify published GitHub release
        shell: pwsh
        run: |
          $json = gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --json tagName,isPrerelease,assets | ConvertFrom-Json
          if ($json.tagName -ne $env:RELEASE_TAG) { throw "Published tag mismatch." }
          if (-not $json.isPrerelease) { throw "Release was not published as a prerelease." }
          $names = @($json.assets | ForEach-Object { $_.name })
          $required = @("QanteakOS-Setup-$env:VERSION.exe","QanteakOS-Setup-$env:VERSION.exe.blockmap","latest.yml")
          foreach ($name in $required) { if ($names -notcontains $name) { throw "Published release is missing $name" } }
          if ($names.Count -ne 3) { throw "Published release has unexpected updater assets: $($names -join ', ')" }
          Write-Host "Qanteak $env:VERSION is live with the exact updater trio."
        env:
          GH_TOKEN: ${{ github.token }}
