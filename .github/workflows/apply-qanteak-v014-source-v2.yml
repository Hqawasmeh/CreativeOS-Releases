name: Apply Qanteak RC9 V0.14 Source V2

on:
  push:
    paths:
      - '.github/workflows/apply-qanteak-v014-source-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: qanteak-desktop/package-lock.json
      - name: Apply V0.14 source upgrade
        run: python qanteak-desktop/scripts/upgrade-v014.py
      - name: Install dependencies
        working-directory: qanteak-desktop
        run: npm ci
      - name: Verify source, renderer and interactions
        working-directory: qanteak-desktop
        run: npm run build
      - name: Syntax checks
        working-directory: qanteak-desktop
        run: |
          node --check src/app.js
          node --check electron/backend.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
      - name: Commit verified V0.14 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qanteak-desktop
          if git diff --cached --quiet; then
            echo 'V0.14 source already applied.'
            exit 0
          fi
          git commit -m 'Qanteak OS RC9 V0.14 cloud reliability and permissions'
          git push
