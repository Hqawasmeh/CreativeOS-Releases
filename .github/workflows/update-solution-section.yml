name: Update Qanteak solution section
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-solution-section.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update solution section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,re
          p=Path('docs/index.html')
          s=p.read_text()
          sec=base64.b64decode('').decode()
          css=base64.b64decode('').decode()
          # remove any prior injected redesign block
          s=re.sub(r'/\* Solution map redesign.*?(?=</style>)','',s,flags=re.S)
          s=re.sub(r'<section class="section" id="solution">.*?</section>',sec,s,count=1,flags=re.S)
          s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s)
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Redesign Qanteak solution map across all sizes'
          git push
