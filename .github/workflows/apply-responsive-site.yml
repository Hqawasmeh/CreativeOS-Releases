name: Apply responsive Qanteak homepage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-responsive-site.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode responsive homepage
        shell: bash
        run: echo '' | base64 -d | gzip -d > docs/index.html
      - name: Commit responsive homepage
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Qanteak mobile and tablet layout'
          git push
