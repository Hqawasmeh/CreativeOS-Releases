name: Harden Qanteak RC9 V0.14 UI Permissions

on:
  push:
    paths:
      - '.github/workflows/harden-qanteak-v014-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: qanteak-desktop/package-lock.json
      - run: python qanteak-desktop/scripts/harden-v014-ui.py
      - working-directory: qanteak-desktop
        run: npm ci
      - working-directory: qanteak-desktop
        run: npm run build
      - working-directory: qanteak-desktop
        run: node --check src/app.js
      - name: Commit verified hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qanteak-desktop/src/app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Harden V0.14 permission visibility and navigation'
          git push
